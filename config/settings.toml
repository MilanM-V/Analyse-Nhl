# ─── NHL Bot Configuration ───────────────────────────────────────────────────
# Source unique pour tous les seuils et paramètres du bot.
# Modifier ici au lieu de chercher dans le code.

[thresholds.buteurs]
# V17 Mode "Rentabilité Solide" (45.5% WR)
qs_min = 11.50          # Seuil unique QS buteur
season_g_min = 0.40     # Buteur confirmé sur la saison
l10_sog_min = 3.0       # Tirs cadrés L10 minimum
l10_hdcf_min = 2.0      # Tirs haute danger L10 minimum (NOUVEAU)
home_only = true        # Ne parier que sur les joueurs à domicile (NOUVEAU)

[thresholds.passeurs]
# V17 Mode Rentable — (55.4% WR, +7.5% ROI)
qs_min = 10.0           # Seuil unique QS passeur
season_a_min = 0.50     # Passeur très régulier
l10_a_min = 0.80        # Très en forme (8 passes sur 10 matchs)
home_only = true        # Domicile uniquement
[thresholds.pointeurs]
# V17 Mode Rentable — (67.5% WR, +5.9% ROI)
qs_min = 10.0           # Seuil unique QS pointeur
season_pts_min = 0.80   # Star de l'équipe (proche de 1 pt/match)
l10_pts_min = 0.40      # Minimum syndical sur la forme récente
home_only = true        # Domicile uniquement

[thresholds.general]
atoi_min = 13.0

[kelly]
buteur_cap = 3.0
passeur_cap = 2.0
pointeur_cap = 2.0

[wave]
ecart_max_min = 5
force_envoi_min_avant = 17

[csv]
# Séparateur décimal pour les CSV de log ("," = format FR, "." = international)
decimal_separator = ","

[api]
season_id = "20252026"
game_type = "2"
semaphore_limit = 20

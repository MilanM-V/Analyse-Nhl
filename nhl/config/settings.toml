# ─── NHL Bot Configuration ───────────────────────────────────────────────────
# Source unique pour tous les seuils et paramètres du bot.
# V18 — Filtres optimisés sur 2893 joueurs (grid search exhaustif)

[thresholds.buteurs]
# OMEGA Optimal — Buteurs (+87.9 U)
season_g_min = 0.40
l10_sog_min = 2.5
l10_hdcf_min = 1.5
home_only = false
opp_ga_min = 2.5
cote_min = 3.00  # Sécurité : On cible le segment rentable (ROI +54%)

[thresholds.passeurs]
# OMEGA Optimal — Passeurs (+22.1 U)
season_a_min = 0.50
l10_a_min = 0.60
home_only = true
atoi_min = 16.0
opp_ga_min = 2.6
cote_min = 2.20  # Sécurité : Évite les cotes trop basses à ROI négatif

[thresholds.pointeurs]
# OMEGA Optimal — Pointeurs (+62.3 U)
season_pts_min = 0.90
l10_pts_min = 0.60
home_only = false
atoi_min = 17.0
opp_ga_min = 2.6
cote_min = 1.70  # Sécurité : Break-even minimum

[thresholds.general]
atoi_min = 13.0

[thresholds.ev_adaptive]
# Seuils EV dynamiques selon la cote (P9)
low_odds_cutoff = 2.00
low_odds_min_ev = 0.08   # 8% minimum pour contrer le vig bookmaker
mid_odds_cutoff = 3.50
mid_odds_min_ev = 0.05   # 5% zone standard
high_odds_min_ev = 0.10  # 10% pour compenser la forte variance

[kelly]
# Quarter Kelly fraction is used in bot_logic / kelly
buteur_cap = 1.5
passeur_cap = 2.0
pointeur_cap = 2.0

[wave]
ecart_max_min = 5
force_envoi_min_avant = 17

[csv]
# Séparateur décimal pour les CSV de log ("," = format FR, "." = international)
decimal_separator = ","

[api]
mode = "playoff"        # "regular" ou "playoff"
season_id = "20252026"
game_type = "2"         # Ne pas toucher manuellement en mode playoff
semaphore_limit = 20
